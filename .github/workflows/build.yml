name: build-ios-helpers
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build varfix (try entry variants)
        run: |
          set -x
          CF="clang -target arm64-apple-ios16.5 -O2 -nostdlib -fno-stack-protector -fuse-ld=lld -Wl,-platform_version,ios,16.5,16.5"
          $CF -Wl,--entry=_start -o varfix_a varfix_nolibc.c && echo OK_A
          $CF -Wl,-e,_start    -o varfix_b varfix_nolibc.c && echo OK_B
          $CF -Wl,-e,_main     -o varfix_c varfix_nolibc.c && echo OK_C
          for f in varfix_a varfix_b varfix_c; do
            if [ -f $f ]; then echo "== $f"; python3 inspect.py $f; sha256sum $f; fi
          done
          true

      - name: build dylib
        run: |
          set -x
          clang -target arm64-apple-ios16.5 -O2 -fPIC -dynamiclib -nostdlib -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,/redwood/lib/libvarfix.dylib \
            -Wl,-platform_version,ios,16.5,16.5 \
            -o libvarfix.dylib libvarfix_dl.c
          python3 inspect.py libvarfix.dylib
          sha256sum libvarfix.dylib

      - name: build sbwatch
        run: |
          clang -target arm64-apple-ios16.5 -O2 -fPIC -dynamiclib -nostdlib -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,/redwood/lib/libsbwatch.dylib \
            -Wl,-platform_version,ios,16.5,16.5 \
            -o libsbwatch.dylib libsbwatch.c
          python3 inspect.py libsbwatch.dylib
          sha256sum libsbwatch.dylib

      - name: build xpcwatch
        run: |
          clang -target arm64-apple-ios16.5 -O2 -fPIC -dynamiclib -nostdlib -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,/redwood/lib/libxpcwatch.dylib \
            -Wl,-platform_version,ios,16.5,16.5 \
            -o libxpcwatch.dylib libxpcwatch.c
          python3 inspect.py libxpcwatch.dylib || true
          sha256sum libxpcwatch.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: hakios-helpers
          path: |
            varfix_*
            libvarfix.dylib
            libsbwatch.dylib
            libxpcwatch.dylib
