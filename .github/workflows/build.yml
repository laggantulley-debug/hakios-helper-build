name: build-ios-helpers
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: clang --version && ld.lld --version
      - name: build varfix
        run: clang -target arm64-apple-ios16.5 -O2 -nostdlib -fno-stack-protector -Wl,-e,_start -Wl,-platform_version,ios,16.5,16.5 -o varfix varfix_nolibc.c
      - name: check varfix
        run: python3 inspect.py varfix && sha256sum varfix
      - name: build dylib
        run: clang -target arm64-apple-ios16.5 -O2 -fPIC -dynamiclib -nostdlib -Wl,-undefined,dynamic_lookup -Wl,-install_name,/redwood/lib/libvarfix.dylib -Wl,-platform_version,ios,16.5,16.5 -o libvarfix.dylib libvarfix_dl.c
      - name: check dylib
        run: python3 inspect.py libvarfix.dylib && sha256sum libvarfix.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: hakios-helpers
          path: varfix
      - uses: actions/upload-artifact@v4
        with:
          name: hakios-helpers-dylib
          path: libvarfix.dylib
