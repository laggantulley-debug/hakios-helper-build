name: qemu-cloud
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          uname -m
          nproc
          free -m | head -2
          df -h / | tail -1

      - name: 装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm p7zip-full
          qemu-system-aarch64 --version | head -1

      - name: 取运行时素材
        run: |
          mkdir -p rt shots
          B=https://github.com/laggantulley-debug/hakios-helper-build/releases/download/runtime-assets
          curl -sSL -o rt/mach-hakiosdev $B/mach-hakiosdev-patched
          curl -sSL -o rt/loader.efi $B/loader.efi
          curl -sSL -o rt/md1-roots.apfs $B/md1-roots.apfs
          curl -sSL -o rt/mkpayload.py $B/mkpayload.py
          ls -l rt

      - name: 分块下载并逐卷解压
        run: |
          B=https://github.com/laggantulley-debug/hakios-helper-build/releases/download/tree-chunks
          mkdir -p dl
          for base in t-aa t-ab t-ac t-ad t-ae t-af; do
            for suf in aa ab ac ad ae af ag; do
              curl -sSLf -o dl/$base-$suf $B/$base-$suf 2>/dev/null || { rm -f dl/$base-$suf; continue; }
            done
            cat dl/$base-* > $base.gz
            gunzip -f $base.gz
            echo "$base 解压完 $(stat -c %s $base) B"
            rm -f dl/$base-*
          done
          cat t-aa t-ab t-ac t-ad t-ae t-af > tree.tar
          rm -f t-aa t-ab t-ac t-ad t-ae t-af
          echo "tar $(stat -c %s tree.tar) B"

      - name: 解包
        run: |
          mkdir -p tree
          tar -xf tree.tar -C tree
          rm -f tree.tar
          echo "文件 $(find tree -type f | wc -l) 目录 $(find tree -type d | wc -l)"
          wc -l tree/etc/var.skel
          df -h / | tail -1

      - name: 云端建压缩卷
        run: |
          curl -sSL -o mkapfs.py https://raw.githubusercontent.com/oosexgang/hakios-xnu-kernel/main/tools/apfs/mkapfs.py
          wc -l mkapfs.py
          time python3 mkapfs.py -z --plain System/Cryptexes/OS/System/Library/Caches/com.apple.dyld -o volume.apfs "root=$PWD/tree,manifest=$PWD/merged.manifest"
          ls -l volume.apfs

      - name: 造常驻镜像与载荷
        run: |
          python3 ci-make-ram.py volume.apfs
          python3 rt/mkpayload.py -o p.bin "loader=rt/loader.efi" "kernel=rt/mach-hakiosdev" "ramdisk=rt/md1-roots.apfs" --cmdline "virtio_input=1 cpus=1 systrace=1 cs_enforcement_disable=1 rd=md0 allow_legacy_mach_msg=1 loader_return_after=600 ca_vbl=1 applog=1 applog_name=SpringBoard" --rdres "$(printf '%x' $(stat -c %s volume.apfs))"
          ls -l p.bin

      - name: 跑 QEMU 并抓帧
        run: |
          sudo qemu-system-aarch64 -M virt -cpu max -smp 1 -m 10G -object memory-backend-file,id=ram,size=10G,mem-path=$PWD/ram.img,share=off -machine memory-backend=ram -display none -serial file:serial.txt -kernel rt/loader.efi -drive if=pflash,format=raw,file=p.bin,readonly=on > qemu.out 2> qemu.err &
          QPID=$!
          sleep 30
          FB=$(grep -am1 -oE "display [0-9]+ x [0-9]+ at [0-9a-f]+" serial.txt 2>/dev/null | awk '{print $NF}')
          echo "帧缓冲 = $FB"
          for t in 60 120 180 240 300 360 420 480 540 600; do
            sleep 60
            if [ -n "$FB" ]; then
              sudo python3 fbproc.py "$FB" 1125 2436 shots/shot-$(printf %03d $t)s.png 2>/dev/null || true
            fi
            echo "--- ${t}s 行 $(wc -l < serial.txt) swap $(grep -acE 'swap [0-9]+ ' serial.txt) SYNC$(grep -ac 'xpcwatch] ->' serial.txt)/$(grep -ac 'xpcwatch] <-' serial.txt)"
          done
          sudo kill $QPID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-cloud-result
          path: |
            serial.txt
            shots/
            qemu.err
            qemu.out
